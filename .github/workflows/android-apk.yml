name: CYL Android APK

'on':
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q "$(find . -maxdepth 1 -name '*.zip' | head -1)" -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Java Kotlin compatibility
        run: |
          cat > "$PROJECT_DIR/app/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.cyl.phonerecorder"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.cyl.phonerecorder"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CYL-Phone-Recorder-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
