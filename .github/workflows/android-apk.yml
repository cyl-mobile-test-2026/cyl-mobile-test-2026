name: CYL Android APK

'on':
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract
        run: |
          mkdir extracted
          unzip -q "$(find . -maxdepth 1 -name '*.zip' | head -1)" -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CYL-Phone-Recorder-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
